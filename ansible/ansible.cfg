[defaults]
inventory          = inventory/production.ini
roles_path         = roles
retry_files_enabled = False
stdout_callback    = ansible.builtin.default
result_format      = yaml

[privilege_escalation]
# Deliberately no default become — ahdeploy has no blanket sudo (see ADR-0018 and
# roles/bootstrap_user). Root-requiring steps invoke `sudo <exact whitelisted command>`
# directly inside the task's own `cmd:`, not via Ansible's become mechanism (which would
# try to sudo the module's own dynamically-pathed Python invocation — that never matches
# a static sudoers.d entry). bootstrap.yml runs as root directly, so it needs no become
# either.
become      = False
become_method = sudo
