---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Log in to GHCR
  community.docker.docker_login:
    registry: ghcr.io
    username: "{{ ghcr_owner }}"
    password: "{{ vault_ghcr_token }}"

- name: Deploy docker-compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ 'docker-compose.prod.yml' if is_primary else 'docker-compose.secondary.yml' }}"
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"

- name: Template .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"

- name: Prune unused Docker images to free disk space
  community.docker.docker_prune:
    images: true
    images_filters:
      dangling: false

- name: Pull new backend image
  community.docker.docker_compose_v2_pull:
    project_src: "{{ app_dir }}"
    services:
      - backend

# Migrates against the new image *before* it takes traffic (the `db` service
# keeps running throughout via restart:unless-stopped, so this only needs
# --no-deps to avoid touching it). Prevents a window where the new code is
# already live but its schema/data dependencies aren't there yet — see
# https://github.com/PatrykOstrzolek/architecture-hub-showcase/issues/2.
# async/poll bounds a hung migration (e.g. lock contention) instead of
# hanging the whole deploy indefinitely.
- name: Run database migrations against the new image before cutover
  community.docker.docker_compose_v2_run:
    project_src: "{{ app_dir }}"
    service: backend
    command: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
    cleanup: true
    no_deps: true
  become: true
  become_user: "{{ app_user }}"
  async: 300
  poll: 5
  when: is_primary

- name: Deploy and recreate services with latest image
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    pull: always
    recreate: always
    state: present
    remove_orphans: true

- name: Wait for backend to respond
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/admin/
    status_code: [200, 301, 302]
    follow_redirects: none
  register: app__health
  until: app__health.status in [200, 301, 302]
  retries: 12
  delay: 5

- name: Warm Symfony cache
  ansible.builtin.command: >
    docker exec architecture-hub-backend-1
    php bin/console cache:warmup --env=prod
  become: true
  become_user: "{{ app_user }}"
  changed_when: true
