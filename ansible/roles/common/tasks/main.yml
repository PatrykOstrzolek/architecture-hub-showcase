---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - ufw
      - fail2ban
      - unattended-upgrades
    state: present

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ app_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Allow deploy user passwordless sudo
  ansible.builtin.copy:
    content: "{{ app_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ app_user }}"
    mode: "0440"

# Only runs when the key is actually supplied (see cd-infra.yml, which derives
# it from the same private key already on the runner) so manual/local runs
# that don't pass it still work — trusting the key is otherwise a manual
# one-time step after the first root-run.
- name: Trust deploy user's SSH public key
  ansible.posix.authorized_key:
    user: "{{ app_user }}"
    key: "{{ deploy_ssh_public_key }}"
  when: deploy_ssh_public_key is defined and deploy_ssh_public_key | length > 0

- name: Configure UFW — allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Configure UFW — allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"

- name: Configure UFW — allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
