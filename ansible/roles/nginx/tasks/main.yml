---
- name: Install nginx
  ansible.builtin.apt:
    name:
      - nginx
    state: present

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy virtual host config
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/nginx/sites-available/architecture-hub
    mode: "0644"
  notify: Reload nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/architecture-hub
    dest: /etc/nginx/sites-enabled/architecture-hub
    state: link
    force: true
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
