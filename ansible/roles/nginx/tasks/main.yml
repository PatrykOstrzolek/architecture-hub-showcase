---
- name: Install nginx
  ansible.builtin.apt:
    name:
      - nginx
    state: present

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Ensure certbot webroot exists
  ansible.builtin.file:
    path: "{{ certbot_webroot }}"
    state: directory
    mode: "0755"
  when: not is_primary

# Runs before any cert exists too (first bootstrap) — the template below falls
# back to plain HTTP in that case, so nginx never fails to start waiting on a
# cert file that isn't there yet. The certbot role re-renders this same
# template once it has actually obtained the certificate.
- name: Check for an existing Let's Encrypt certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ ec2_public_hostname }}/fullchain.pem"
  register: nginx_le_cert
  when: not is_primary

- name: Deploy virtual host config
  ansible.builtin.template:
    src: "{{ 'app.conf.j2' if is_primary else 'app-secondary.conf.j2' }}"
    dest: /etc/nginx/sites-available/architecture-hub
    mode: "0644"
  vars:
    tls_cert_exists: "{{ (nginx_le_cert.stat.exists | default(false)) }}"
  notify: Reload nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/architecture-hub
    dest: /etc/nginx/sites-enabled/architecture-hub
    state: link
    force: true
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
