---
# Joins this host to a private Tailscale mesh so the EC2 secondary can reach
# the primary's Postgres without exposing it to the public internet. Both
# primary and secondary run this role — the primary needs to be a tailnet
# member too, since it's the one being connected *to*.
#
# Static Tailscale IP, not MagicDNS: MagicDNS would require the `backend`
# container's own network namespace to resolve *.ts.net (via 100.100.100.100),
# which this stack doesn't otherwise need. A two-node tailnet's IP is stable
# for the life of the device, so one vault-stored value is enough.

- name: Add Tailscale apt repository (deb822 format)
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    state: present
  notify: Update apt cache

- name: Flush handlers so the apt cache is current before installing Tailscale
  ansible.builtin.meta: flush_handlers

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check current tailscale state
  ansible.builtin.command: tailscale status --json
  register: tailscale__status
  changed_when: false
  failed_when: false

- name: Bring up tailscale
  ansible.builtin.command: >
    tailscale up --authkey={{ vault_tailscale_authkey }}
    --hostname={{ inventory_hostname }} --accept-dns=false
  become: true
  no_log: true # the authkey is on the command line — keep it out of CI logs
  changed_when: true
  when: >
    tailscale__status.rc != 0 or
    (tailscale__status.stdout | from_json).BackendState != "Running"
