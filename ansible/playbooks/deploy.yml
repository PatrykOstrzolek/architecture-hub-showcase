---
# Runs as ahdeploy — no become. Docker access comes from group membership; the only
# root-requiring steps (nginx vhost publish + reload) are the four commands whitelisted
# in roles/bootstrap_user's sudoers.d, invoked directly as raw sudo commands. See ADR-0018.
- name: Deploy application
  hosts: web

  vars_files:
    - ../group_vars/all/main.yml
    - ../group_vars/all/vault.yml

  roles:
    - app
    - nginx
