# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    default_locale: en

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Ports (Assessment/Domain, Assessment/Application/Port) -> their one
    # real adapter (Assessment/Infrastructure) — see ADR-0014.
    App\Assessment\Domain\Repository\QuestionRepositoryInterface: '@App\Assessment\Infrastructure\Doctrine\DoctrineQuestionRepository'
    App\Assessment\Domain\Repository\QuestionSetRepositoryInterface: '@App\Assessment\Infrastructure\Doctrine\DoctrineQuestionSetRepository'
    App\Assessment\Domain\Repository\AttemptRepositoryInterface: '@App\Assessment\Infrastructure\Doctrine\DoctrineAttemptRepository'
    App\Assessment\Application\Port\ExerciseQuestionSetLocatorInterface: '@App\Assessment\Infrastructure\Sulu\SuluExerciseQuestionSetLocator'

    # sulu_headless.content_type_resolver, not sulu_content.property_resolver —
    # HeadlessWebsiteController (the .json public routes) consults
    # sulu/headless-bundle's own, separate ContentTypeResolver system.
    App\Assessment\Infrastructure\Sulu\PropertyResolver\QuestionSetSelectionPropertyResolver:
        tags:
            - { name: 'sulu_headless.content_type_resolver' }

    # Tagged sulu.context: admin — registers the "Questions"/"Question Sets"
    # admin nav items + REST resources, admin-context-only (see AssessmentAdmin).
    App\Assessment\Infrastructure\Sulu\Admin\AssessmentAdmin:
        tags:
            - { name: 'sulu.admin' }
            - { name: 'sulu.context', context: 'admin' }

    App\EventSubscriber\NextjsCacheInvalidationSubscriber:
        arguments:
            $nextRevalidateUrl: '%env(default::NEXT_REVALIDATE_URL)%'
            $nextRevalidateSecret: '%env(default::REVALIDATE_SECRET)%'

    App\Controller\Website\PagePreviewController:
        arguments:
            $previewSecret: '%env(default::PREVIEW_SECRET)%'

    # Tagged sulu.context: admin because it references the admin-context-only
    # sulu_preview.public_preview_controller service and overrides an
    # admin-context route (/admin/p/{token}) — see RemoveForeignContextServicesPass.
    App\Controller\Website\PreviewLinkRedirectController:
        arguments:
            $original: '@sulu_preview.public_preview_controller'
            # Reuses the frontend URL already configured for cache revalidation —
            # both are "the public Next.js origin", just used in opposite directions.
            $frontendUrl: '%env(default::NEXT_REVALIDATE_URL)%'
            $previewSecret: '%env(default::PREVIEW_SECRET)%'
        tags:
            - { name: 'sulu.context', context: 'admin' }
