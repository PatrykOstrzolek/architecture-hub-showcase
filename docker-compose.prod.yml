name: architecture-hub
# Pinned regardless of which directory this file is deployed from — Compose defaults the
# project name to the directory basename, which would silently create new, empty
# db_data/uploads volumes if that directory ever moves or is renamed (see ADR-0019).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 256m
    ports:
      # Bound to localhost only — this is what keeps Postgres off the public
      # internet, not any UFW rule. Docker's DNAT for published ports bypasses
      # UFW's chains entirely, so a bind to 0.0.0.0 here would be reachable
      # from anywhere despite UFW. See docs/operations/infrastructure.md.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 10s
      retries: 5

  backend:
    image: ghcr.io/${GHCR_OWNER}/architecture-hub-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_DATABASE}?serverVersion=16&charset=utf8
      DEFAULT_URI: ${DEFAULT_URI}
      LOCK_DSN: flock
      SEAL_DSN: loupe:///var/www/html/var/indexes
      NEXT_REVALIDATE_URL: ${NEXT_REVALIDATE_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      PHP_MEMORY_LIMIT: 1G
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/admin/"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
